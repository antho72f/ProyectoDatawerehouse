{% extends 'layout/base.html' %}

{% block title %} Home {% endblock %}

{% block content_section %}
<section id="hero" class="hero d-flex flex-column justify-content-center align-items-center" data-aos="fade" data-aos-delay="1500">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-6 text-center">
          <h2>Impacto de <span>facilidades</span> cercanas, promedio de venta y la cantidad de venta de propiedades</h2>
          <p></p>
        </div>
      </div>
    </div>
  </section>
{% endblock %}

{% block content_body %}
<div style="width: 70%; height: 550px; margin: auto;">
    <canvas id="facilitiesChart"></canvas>
</div>
<script>
    var ctx = document.getElementById('facilitiesChart').getContext('2d');
    var data = JSON.parse('{{ data|safe }}');
    
    var facilityCounts = data.map(item => item[0]);
    var avgPrices = data.map(item => item[1]);
    var totalSales = data.map(item => item[2]);
    
    var chartData = {
        datasets: [{
            label: 'Precio Promedio de Venta',
            data: avgPrices,
            backgroundColor: 'rgba(75, 192, 192, 0.5)',
            borderColor: 'rgba(75, 192, 192, 1)',
            borderWidth: 1,
            pointBackgroundColor: 'rgba(75, 192, 192, 1)',
            pointRadius: 8
        }, {
            label: 'Total Propiedades Vendidas',
            data: totalSales,
            backgroundColor: 'rgba(255, 99, 132, 0.5)',
            borderColor: 'rgba(255, 99, 132, 1)',
            borderWidth: 1,
            pointBackgroundColor: 'rgba(255, 99, 132, 1)',
            pointRadius: 8
        }],
        labels: facilityCounts
    };
    
    var myChart = new Chart(ctx, {
        type: 'bubble',
        data: chartData,
        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            },
            plugins: {
                tooltip: {
                    callbacks: {
                        label: function (context) {
                            var label = context.dataset.label || '';
                            if (label) {
                                label += ': ';
                            }
                            label += new Intl.NumberFormat('es-ES', { style: 'decimal', minimumFractionDigits: 2 }).format(context.parsed.y);
                            return label;
                        }
                    }
                }
            }
        }
    });
</script>


{% endblock %}
