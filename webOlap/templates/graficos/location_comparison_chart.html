{% extends 'layout/base.html' %}

{% block title %} Home {% endblock %}

{% block content_section %}
<section id="hero" class="hero d-flex flex-column justify-content-center align-items-center" data-aos="fade" data-aos-delay="1500">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-6 text-center">
          <h2>Gráfico que compara el número de <span>propiedades</span> vendidas en funcion a su ubicacion</h2>
          <p></p>
        </div>
      </div>
    </div>
  </section>
{% endblock %}

{% block content_body %}
<div style="width: 90%; height: 550px; margin: auto;">
    <canvas id="locationChart"></canvas>
</div>

<script>
    var ctx = document.getElementById('locationChart').getContext('2d');
    var data = JSON.parse('{{ data|safe }}');
    
    var labels = data.map(item => item[0]);
    var values = data.map(item => item[1]);
    
    var chartData = {
        labels: labels,
        datasets: [{
            data: values,
            backgroundColor: [
                'rgba(255, 99, 132, 0.2)',
                'rgba(54, 162, 235, 0.2)',
                'rgba(255, 206, 86, 0.2)',
                // ... Puedes agregar más colores aquí
            ],
            borderColor: [
                'rgba(255, 99, 132, 1)',
                'rgba(54, 162, 235, 1)',
                'rgba(255, 206, 86, 1)',
                // ... Puedes agregar más colores aquí
            ],
            borderWidth: 1
        }]
    };
    
    var myChart = new Chart(ctx, {
        type: 'doughnut',
        data: chartData,
        options: {
            responsive: true,
            maintainAspectRatio: false
        }
    });
</script>    
{% endblock %}
