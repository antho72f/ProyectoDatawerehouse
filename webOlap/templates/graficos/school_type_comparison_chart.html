{% extends 'layout/base.html' %}

{% block title %} Home {% endblock %}

{% block content_section %}
<section id="hero" class="hero d-flex flex-column justify-content-center align-items-center" data-aos="fade" data-aos-delay="1500">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-6 text-center">
          <h2>Gráfico que compara el número de <span>propiedades</span> vendidas en función del tipo de escuela cercana</h2>
          <p></p>
        </div>
      </div>
    </div>
  </section>
{% endblock %}

{% block content_body %}
<div style="width: 90%; height: 550px; margin: auto;">
    <canvas id="schoolTypeChart"></canvas>
</div>

<script>
    var ctx = document.getElementById('schoolTypeChart').getContext('2d');
    var data = JSON.parse('{{ data|safe }}');
    
    var elementaryCounts = data.map(item => item[0]);
    var middleCounts = data.map(item => item[1]);
    var highCounts = data.map(item => item[2]);
    var universityCounts = data.map(item => item[3]);
    
    // Calcular los valores totales para cada posición
    var totalCounts = [];
    for (var i = 0; i < elementaryCounts.length; i++) {
        totalCounts.push(
            elementaryCounts[i] + middleCounts[i] + highCounts[i] + universityCounts[i]
        );
    }
    
    var chartData = {
        labels: elementaryCounts.map((_, index) => 'Escuelas'),
        datasets: [{
            label: 'Prescolares',
            data: elementaryCounts,
            backgroundColor: 'rgba(255, 99, 132, 0.5)',
            borderColor: 'rgba(255, 99, 132, 1)',
            borderWidth: 1
        }, {
            label: 'Primarias',
            data: middleCounts,
            backgroundColor: 'rgba(54, 162, 235, 0.5)',
            borderColor: 'rgba(54, 162, 235, 1)',
            borderWidth: 1
        }, {
            label: 'Secundarias',
            data: highCounts,
            backgroundColor: 'rgba(255, 206, 86, 0.5)',
            borderColor: 'rgba(255, 206, 86, 1)',
            borderWidth: 1
        }, {
            label: 'Universidades',
            data: universityCounts,
            backgroundColor: 'rgba(75, 192, 192, 0.5)',
            borderColor: 'rgba(75, 192, 192, 1)',
            borderWidth: 1
        }, {
            label: 'Total Propiedades Vendidas',
            data: totalCounts,  // Usar los valores calculados
            backgroundColor: 'rgba(0, 0, 0, 0.5)',
            borderColor: 'rgba(0, 0, 0, 1)',
            borderWidth: 1
        }]
    };
    
    var myChart = new Chart(ctx, {
        type: 'bar',
        data: chartData,
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: {
                    stacked: true
                },
                y: {
                    beginAtZero: true
                }
            }
        }
    });
</script>


{% endblock %}
